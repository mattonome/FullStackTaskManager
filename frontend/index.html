<html lang="en">

    <!-- Meta description for search engines & link previews -->
    <meta name="description" content="Track your daily tasks and never leave any undone." />

    <meta property="og:description" content="Track your daily tasks and never leave any undone." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskmanager.onrender.com" />

    <meta name="twitter:description" content="Track your daily tasks and never leave any undone." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
